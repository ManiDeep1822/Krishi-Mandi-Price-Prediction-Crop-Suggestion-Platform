<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162f6a" />
      <stop offset="100%" stop-color="#0a1730" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge with National Gold Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#ff9933" stroke-width="2.2" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#214aab" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Agricultural Crop Sprout & Wheat Stalk -->
  <!-- Central Stem -->
  <path d="M32 50 L32 18" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Wheat Ear Tip -->
  <path d="M32 12 C30.5 14.8 30.5 17.5 32 19.5 C33.5 17.5 33.5 14.8 32 12 Z" fill="url(#goldGrad)" />

  <!-- Wheat Grains (Kernels) Left & Right -->
  <!-- Grain Pair 1 -->
  <path d="M32 20.5 C27.5 18.5 24.5 20.5 27.5 23.5 C29.5 24 31.5 22.5 32 20.5 Z" fill="url(#goldGrad)" />
  <path d="M32 20.5 C36.5 18.5 39.5 20.5 36.5 23.5 C34.5 24 32.5 22.5 32 20.5 Z" fill="url(#goldGrad)" />

  <!-- Grain Pair 2 -->
  <path d="M32 25.5 C26.5 23.5 23.5 25.5 26.5 28.5 C29 29 31.5 27.5 32 25.5 Z" fill="url(#goldGrad)" />
  <path d="M32 25.5 C37.5 23.5 40.5 25.5 37.5 28.5 C35 29 32.5 27.5 32 25.5 Z" fill="url(#goldGrad)" />

  <!-- Grain Pair 3 -->
  <path d="M32 30.5 C26.5 28.5 23.5 30.5 26.5 33.5 C29 34 31.5 32.5 32 30.5 Z" fill="url(#goldGrad)" />
  <path d="M32 30.5 C37.5 28.5 40.5 30.5 37.5 33.5 C35 34 32.5 32.5 32 30.5 Z" fill="url(#goldGrad)" />

  <!-- Green Base Leaves / Sprout Wings -->
  <!-- Left Sprout Leaf -->
  <path d="M32 44 C23 42 15 34 17 26 C22 28 28.5 35.5 32 40 Z" fill="url(#leafGrad)" />
  <!-- Right Sprout Leaf -->
  <path d="M32 44 C41 42 49 34 47 26 C42 28 35.5 35.5 32 40 Z" fill="url(#leafGrad)" />

  <!-- Golden Harvest Seed Base -->
  <circle cx="32" cy="46" r="2.5" fill="url(#goldGrad)" />
</svg>
